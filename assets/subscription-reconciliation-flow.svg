<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" width="100%" role="img"
  aria-labelledby="title desc">
  <title id="title">App Store 구독 상태 처리 및 대사 흐름</title>
  <desc id="desc">App Store Webhook을 SQS에 보관한 뒤 고유 식별자와 서명시각을 비교해 중복과 순서 역전을 차단한다. Webhook이 유실되면 확인 시점이 지난 구독만 Apple에서 다시 조회하고, 조회 결과를 같은 구독 상태 변경 단계에 반영한다.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
      orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8b8f8a" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
      orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5b8a68" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
      orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#b75b4b" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </marker>
  </defs>

  <style>
    text { font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .lane { font-size: 20px; font-weight: 720; fill: #343936; }
    .lane-note { font-size: 13px; font-weight: 500; fill: #777c77; }
    .box-title { font-size: 16px; font-weight: 680; fill: #343936; }
    .box-sub { font-size: 12px; font-weight: 520; fill: #747a74; }
    .decision-title { font-size: 16px; font-weight: 700; fill: #6f512d; }
    .decision-sub { font-size: 12px; font-weight: 560; fill: #86683f; }
    .state-title { font-size: 17px; font-weight: 720; fill: #3f6d4f; }
    .state-sub { font-size: 12px; font-weight: 540; fill: #5e7866; }
    .reject { font-size: 12px; font-weight: 650; fill: #984537; }
    .arrow-label { font-size: 11px; font-weight: 620; fill: #70756f; }
  </style>

  <!-- Webhook 처리 -->
  <text class="lane" x="50" y="48">Webhook 처리</text>
  <text class="lane-note" x="50" y="72">이벤트를 먼저 보관하고, 중복 여부와 발생 순서를 확인한 뒤 구독 상태를 바꿉니다.</text>

  <rect x="50" y="112" width="140" height="72" rx="9" fill="#f3f7fc" stroke="#afc4de"
    stroke-width="1.5" />
  <text class="box-title" x="120" y="142" text-anchor="middle">Apple</text>
  <text class="box-sub" x="120" y="165" text-anchor="middle">구독 상태 변경 알림</text>

  <line x1="190" y1="148" x2="220" y2="148" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="230" y="112" width="150" height="72" rx="9" fill="#fff" stroke="#c8cbc7"
    stroke-width="1.5" />
  <text class="box-title" x="305" y="142" text-anchor="middle">Webhook 수신</text>
  <text class="box-sub" x="305" y="165" text-anchor="middle">API Gateway</text>

  <line x1="380" y1="148" x2="410" y2="148" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="420" y="104" width="160" height="88" rx="9" fill="#f3f7fc" stroke="#afc4de"
    stroke-width="1.5" />
  <text class="box-title" x="500" y="136" text-anchor="middle">이벤트 보관</text>
  <text class="box-sub" x="500" y="159" text-anchor="middle">SQS</text>
  <text class="box-sub" x="500" y="178" text-anchor="middle">Retry · DLQ</text>

  <line x1="580" y1="148" x2="610" y2="148" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="620" y="104" width="170" height="88" rx="9" fill="#fff" stroke="#c8cbc7"
    stroke-width="1.5" />
  <text class="box-title" x="705" y="136" text-anchor="middle">이벤트 검증</text>
  <text class="box-sub" x="705" y="159" text-anchor="middle">JWS 서명 검증</text>
  <text class="box-sub" x="705" y="178" text-anchor="middle">변경할 상태 판정</text>

  <line x1="790" y1="148" x2="820" y2="148" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="830" y="98" width="160" height="100" rx="9" fill="#fffaf2" stroke="#ad7b45"
    stroke-width="1.7" />
  <text class="decision-title" x="910" y="134" text-anchor="middle">중복 판별</text>
  <text class="decision-sub" x="910" y="160" text-anchor="middle">notificationUUID</text>
  <text class="decision-sub" x="910" y="180" text-anchor="middle">이미 반영했는가?</text>

  <line x1="990" y1="148" x2="1020" y2="148" stroke="#5b8a68" stroke-width="1.7"
    marker-end="url(#arrow-green)" />
  <text class="arrow-label" x="1005" y="135" text-anchor="middle">아니요</text>

  <rect x="1030" y="98" width="160" height="100" rx="9" fill="#fffaf2" stroke="#ad7b45"
    stroke-width="1.7" />
  <text class="decision-title" x="1110" y="134" text-anchor="middle">순서 판정</text>
  <text class="decision-sub" x="1110" y="160" text-anchor="middle">signedDate</text>
  <text class="decision-sub" x="1110" y="180" text-anchor="middle">현재 값보다 최신인가?</text>

  <line x1="1190" y1="148" x2="1220" y2="148" stroke="#5b8a68" stroke-width="1.7"
    marker-end="url(#arrow-green)" />
  <text class="arrow-label" x="1205" y="135" text-anchor="middle">예</text>

  <rect x="1230" y="92" width="200" height="112" rx="10" fill="#f3f8f4" stroke="#91b79b"
    stroke-width="1.7" />
  <text class="state-title" x="1330" y="128" text-anchor="middle">구독 상태 변경</text>
  <text class="state-sub" x="1330" y="155" text-anchor="middle">내부 구독 상태 갱신</text>
  <text class="state-sub" x="1330" y="178" text-anchor="middle">nextCheckAt 계산</text>

  <line x1="910" y1="198" x2="910" y2="224" stroke="#b75b4b" stroke-width="1.5"
    marker-end="url(#arrow-red)" />
  <rect x="824" y="234" width="172" height="42" rx="8" fill="#fff4f1" stroke="#d79c91" />
  <text class="reject" x="910" y="260" text-anchor="middle">중복 이벤트 → 반영하지 않음</text>

  <line x1="1110" y1="198" x2="1110" y2="224" stroke="#b75b4b" stroke-width="1.5"
    marker-end="url(#arrow-red)" />
  <rect x="1024" y="234" width="172" height="42" rx="8" fill="#fff4f1" stroke="#d79c91" />
  <text class="reject" x="1110" y="260" text-anchor="middle">과거 이벤트 → 반영하지 않음</text>

  <line x1="50" y1="315" x2="1430" y2="315" stroke="#d9dcd7" stroke-width="1.5"
    stroke-dasharray="7 7" />

  <!-- Webhook 유실 복구와 대사 -->
  <text class="lane" x="50" y="365">Webhook 유실 복구 · 대사</text>
  <text class="lane-note" x="50" y="391">확인 시점이 지난 구독만 Apple에서 다시 조회하고, 조회 결과가 다르면 내부 상태를 바로잡습니다.</text>

  <rect x="50" y="448" width="150" height="78" rx="9" fill="#fff" stroke="#c8cbc7"
    stroke-width="1.5" />
  <text class="box-title" x="125" y="479" text-anchor="middle">15분마다 실행</text>
  <text class="box-sub" x="125" y="503" text-anchor="middle">스케줄러</text>

  <line x1="200" y1="487" x2="230" y2="487" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="240" y="441" width="230" height="92" rx="9" fill="#fff" stroke="#c8cbc7"
    stroke-width="1.5" />
  <text class="box-title" x="355" y="473" text-anchor="middle">확인 대상 조회</text>
  <text class="box-sub" x="355" y="497" text-anchor="middle">bucket = DUE</text>
  <text class="box-sub" x="355" y="517" text-anchor="middle">nextCheckAt ≤ 현재 시각</text>

  <line x1="470" y1="487" x2="500" y2="487" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="510" y="448" width="170" height="78" rx="9" fill="#f3f7fc" stroke="#afc4de"
    stroke-width="1.5" />
  <text class="box-title" x="595" y="479" text-anchor="middle">대사 요청 보관</text>
  <text class="box-sub" x="595" y="503" text-anchor="middle">SQS</text>

  <line x1="680" y1="487" x2="710" y2="487" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="720" y="448" width="190" height="78" rx="9" fill="#fff" stroke="#c8cbc7"
    stroke-width="1.5" />
  <text class="box-title" x="815" y="479" text-anchor="middle">구독 상태 확인</text>
  <text class="box-sub" x="815" y="503" text-anchor="middle">Apple에 조회 요청</text>

  <line x1="910" y1="487" x2="940" y2="487" stroke="#8b8f8a" stroke-width="1.5"
    marker-end="url(#arrow-gray)" />

  <rect x="950" y="443" width="230" height="88" rx="9" fill="#f3f7fc" stroke="#afc4de"
    stroke-width="1.5" />
  <text class="box-title" x="1065" y="476" text-anchor="middle">Apple 구독 상태 조회</text>
  <text class="box-sub" x="1065" y="501" text-anchor="middle">App Store Server API</text>

  <path d="M1180 487H1330V204" fill="none" stroke="#5b8a68" stroke-width="1.8"
    marker-end="url(#arrow-green)" />
  <text class="arrow-label" x="1312" y="422" text-anchor="end">내부 상태와 비교 후 반영</text>
</svg>
